<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <!-- Candy body gradient: muted tangerine / soft coral -->
    <radialGradient id="candyBody" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F4A87A"/>
      <stop offset="60%" stop-color="#E88B5E"/>
      <stop offset="100%" stop-color="#D47A4E"/>
    </radialGradient>
    <!-- Wrapper gradient: soft mint green -->
    <linearGradient id="wrapperLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8DFC8"/>
      <stop offset="100%" stop-color="#7BC7AB"/>
    </linearGradient>
    <linearGradient id="wrapperRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8DFC8"/>
      <stop offset="100%" stop-color="#7BC7AB"/>
    </linearGradient>
    <!-- Subtle facet highlight -->
    <radialGradient id="candyHighlight" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#FBD4B0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FBD4B0" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold accent -->
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A853" stop-opacity="0"/>
      <stop offset="15%" stop-color="#D4A853" stop-opacity="1"/>
      <stop offset="85%" stop-color="#D4A853" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D4A853" stop-opacity="0"/>
    </linearGradient>
    <!-- Dusty rose text gradient -->
    <linearGradient id="dustyRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C26B84"/>
      <stop offset="100%" stop-color="#B05A73"/>
    </linearGradient>
  </defs>

  <!-- ===== HORIZONTAL LOGO ===== -->
  <g transform="translate(400, 120)">
    <!-- Decorative gold line above -->
    <line x1="-180" y1="-65" x2="180" y2="-65" stroke="url(#goldLine)" stroke-width="1" opacity="0.6"/>

    <!-- Wrapped Candy Icon -->
    <g transform="translate(-195, 0)">
      <!-- Left wrapper twist -->
      <path d="M-8,0 C-18,-18 -35,-30 -55,-25 C-35,-15 -18,-5 -8,-8 Z" fill="url(#wrapperLeft)" opacity="0.9"/>
      <!-- Right wrapper twist -->
      <path d="M8,0 C18,-18 35,-30 55,-25 C35,-15 18,-5 8,-8 Z" fill="url(#wrapperRight)" opacity="0.9"/>
      <!-- Candy body (slightly faceted, rounded) -->
      <ellipse cx="0" cy="0" rx="30" ry="26" fill="url(#candyBody)"/>
      <!-- Facet highlights for soft dimension -->
      <ellipse cx="-8" cy="-6" rx="16" ry="12" fill="url(#candyHighlight)"/>
      <!-- Center seam line -->
      <ellipse cx="0" cy="0" rx="30" ry="26" fill="none" stroke="#D47A4E" stroke-width="0.5" opacity="0.3"/>
      <!-- Left wrapper fold -->
      <path d="M-28,4 C-40,8 -52,18 -55,25 C-42,15 -30,10 -28,8 Z" fill="url(#wrapperLeft)" opacity="0.85"/>
      <!-- Right wrapper fold -->
      <path d="M28,4 C40,8 52,18 55,25 C42,15 30,10 28,8 Z" fill="url(#wrapperRight)" opacity="0.85"/>
      <!-- Tiny wrapper crease lines -->
      <path d="M-28,2 L-42,12" stroke="#5BAF8F" stroke-width="0.5" opacity="0.4"/>
      <path d="M28,2 L42,12" stroke="#5BAF8F" stroke-width="0.5" opacity="0.4"/>
    </g>

    <!-- "Cristal's" - elegant serif -->
    <text x="-145" y="14" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#B05A73" letter-spacing="1">
      Cristal's
    </text>

    <!-- "CANDIES" - clean spaced sans-serif -->
    <text x="-145" y="42" font-family="'Nunito', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#6B5B6B" letter-spacing="8">
      CANDIES
    </text>

    <!-- Decorative gold line below -->
    <line x1="-180" y1="52" x2="180" y2="52" stroke="url(#goldLine)" stroke-width="1" opacity="0.6"/>

    <!-- Tagline -->
    <text x="-145" y="70" font-family="'Nunito', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#8B7A8B" letter-spacing="2.5">
      HANDCRAFTED IN RIGBY, IDAHO
    </text>
  </g>


  <!-- ===== BADGE / CIRCULAR LOGO ===== -->
  <g transform="translate(400, 370)">
    <!-- Outer circle border - dusty gold -->
    <circle cx="0" cy="0" r="108" fill="none" stroke="#D4A853" stroke-width="1.5" opacity="0.7"/>
    <!-- Inner circle border -->
    <circle cx="0" cy="0" r="103" fill="none" stroke="#D4A853" stroke-width="0.5" opacity="0.4"/>

    <!-- Candy icon centered -->
    <g transform="scale(0.75)">
      <!-- Left wrapper twist -->
      <path d="M-8,0 C-18,-18 -35,-30 -55,-25 C-35,-15 -18,-5 -8,-8 Z" fill="url(#wrapperLeft)" opacity="0.9"/>
      <!-- Right wrapper twist -->
      <path d="M8,0 C18,-18 35,-30 55,-25 C35,-15 18,-5 8,-8 Z" fill="url(#wrapperRight)" opacity="0.9"/>
      <!-- Candy body -->
      <ellipse cx="0" cy="0" rx="30" ry="26" fill="url(#candyBody)"/>
      <!-- Highlight -->
      <ellipse cx="-8" cy="-6" rx="16" ry="12" fill="url(#candyHighlight)"/>
      <!-- Left wrapper fold -->
      <path d="M-28,4 C-40,8 -52,18 -55,25 C-42,15 -30,10 -28,8 Z" fill="url(#wrapperLeft)" opacity="0.85"/>
      <!-- Right wrapper fold -->
      <path d="M28,4 C40,8 52,18 55,25 C42,15 30,10 28,8 Z" fill="url(#wrapperRight)" opacity="0.85"/>
      <!-- Crease lines -->
      <path d="M-28,2 L-42,12" stroke="#5BAF8F" stroke-width="0.5" opacity="0.4"/>
      <path d="M28,2 L42,12" stroke="#5BAF8F" stroke-width="0.5" opacity="0.4"/>
    </g>

    <!-- "Cristal's Candies" curving around the top -->
    <path id="topArc" d="M-90,0 A90,90 0 0,1 90,0" fill="none"/>
    <text font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" fill="#B05A73" letter-spacing="2.5">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">
        Cristal's Candies
      </textPath>
    </text>

    <!-- Tagline curving along the bottom -->
    <path id="bottomArc" d="M-80,5 A80,80 0 0,0 80,5" fill="none"/>
    <text font-family="'Nunito', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#8B7A8B" letter-spacing="2">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
        HANDCRAFTED IN RIGBY, IDAHO
      </textPath>
    </text>

    <!-- Small gold diamond accents on sides -->
    <g transform="translate(-98, 0) rotate(45)" opacity="0.6">
      <rect x="-3" y="-3" width="6" height="6" fill="#D4A853"/>
    </g>
    <g transform="translate(98, 0) rotate(45)" opacity="0.6">
      <rect x="-3" y="-3" width="6" height="6" fill="#D4A853"/>
    </g>
  </g>
</svg>