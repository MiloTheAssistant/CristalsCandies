  <path d="M25,32 C19,22 10,16 5,18 C12,22 19,28 25,29 Z" fill="url(#wrapperL)" opacity="0.9"/>
  <!-- Right wrapper twist -->
  <path d="M39,32 C45,22 54,16 59,18 C52,22 45,28 39,29 Z" fill="url(#wrapperR)" opacity="0.9"/>
  <!-- Candy body -->
  <ellipse cx="32" cy="32" rx="14" ry="12" fill="url(#candyBody)"/>
  <!-- Highlight -->
  <ellipse cx="28" cy="28" rx="8" ry="6" fill="url(#hl)"/>
  <!-- Left wrapper fold -->
