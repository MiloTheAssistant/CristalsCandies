<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="candyBody" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F4A87A"/>
      <stop offset="60%" stop-color="#E88B5E"/>
      <stop offset="100%" stop-color="#D47A4E"/>
    </radialGradient>
    <linearGradient id="wrapperL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8DFC8"/>
      <stop offset="100%" stop-color="#7BC7AB"/>
    </linearGradient>
    <linearGradient id="wrapperR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8DFC8"/>
      <stop offset="100%" stop-color="#7BC7AB"/>
    </linearGradient>
    <radialGradient id="hl" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#FBD4B0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FBD4B0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#FFF9F2" stroke="#D4A853" stroke-width="1" opacity="0.85"/>
